name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: PyO3/maturin-action@v1.51.0
      with:
        manylinux: auto
        command: build
        args: --release --sdist -o dist --find-interpreter
    - name: Upload wheels
      uses: actions/upload-artifact@v7.0.2
      with:
        name: wheels-linux
        path: dist

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: PyO3/maturin-action@v1.51.0
      with:
        command: build
        args: --release -o dist --find-interpreter
    - name: Upload wheels
      uses: actions/upload-artifact@v7.0.2
      with:
        name: wheels-windows
        path: dist

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: PyO3/maturin-action@v1.51.0
      with:
        command: build
        args: --release -o dist --target universal2-apple-darwin --find-interpreter
    - name: Upload wheels
      uses: actions/upload-artifact@v7.0.2
      with:
        name: wheels-macos
        path: dist
